<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 540" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<title>Network Threat Intelligence Platform Architecture</title>
<desc>Left-to-right data pipeline: attack traffic captured by Scapy, aggregated into flows, processed in parallel by an ML detector (XGBoost) and a signature-based detector (Suricata), with alerts triggering automated response playbooks. A React UI consumes alerts and topology data for analysts.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
.th { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.ts { font-size: 12px; font-weight: 400; fill: #5F5E5A; }
.box-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
.box-blue rect { fill: #E6F1FB; stroke: #185FA5; }
.box-blue .th { fill: #0C447C; }
.box-blue .ts { fill: #185FA5; }
.box-amber rect { fill: #FAEEDA; stroke: #854F0B; }
.box-amber .th { fill: #633806; }
.box-amber .ts { fill: #854F0B; }
.box-red rect { fill: #FCEBEB; stroke: #A32D2D; }
.box-red .th { fill: #791F1F; }
.box-red .ts { fill: #A32D2D; }
.box-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
.box-teal .th { fill: #085041; }
.box-teal .ts { fill: #0F6E56; }
.arr { fill: none; stroke: #5F5E5A; stroke-width: 1.5; }
</style>
</defs>

<text class="th" x="40" y="35">Capture</text>
<text class="th" x="200" y="35">Detection</text>
<text class="th" x="430" y="35">Response</text>
<text class="th" x="580" y="35">Operator</text>

<g class="box-gray">
<rect x="40" y="60" width="130" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="105" y="84" text-anchor="middle" dominant-baseline="central">Scapy capture</text>
<text class="ts" x="105" y="102" text-anchor="middle" dominant-baseline="central">Live packet sniffing</text>
</g>

<g class="box-gray">
<rect x="40" y="140" width="130" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="105" y="164" text-anchor="middle" dominant-baseline="central">Flow aggregator</text>
<text class="ts" x="105" y="182" text-anchor="middle" dominant-baseline="central">5-tuple flow records</text>
</g>

<line x1="105" y1="120" x2="105" y2="140" class="arr" marker-end="url(#arrow)"/>

<g class="box-blue">
<rect x="210" y="60" width="170" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="295" y="84" text-anchor="middle" dominant-baseline="central">XGBoost detector</text>
<text class="ts" x="295" y="102" text-anchor="middle" dominant-baseline="central">Behavioral ML model</text>
<text class="ts" x="295" y="120" text-anchor="middle" dominant-baseline="central">CICIDS2017 trained</text>
</g>

<g class="box-amber">
<rect x="210" y="160" width="170" height="80" rx="8" stroke-width="0.5"/>
<text class="th" x="295" y="184" text-anchor="middle" dominant-baseline="central">Suricata detector</text>
<text class="ts" x="295" y="202" text-anchor="middle" dominant-baseline="central">Signature-based IDS</text>
<text class="ts" x="295" y="220" text-anchor="middle" dominant-baseline="central">Custom rules + ET Open</text>
</g>

<line x1="170" y1="170" x2="210" y2="100" class="arr" marker-end="url(#arrow)"/>
<line x1="170" y1="170" x2="210" y2="200" class="arr" marker-end="url(#arrow)"/>

<g class="box-gray">
<rect x="210" y="270" width="170" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="295" y="294" text-anchor="middle" dominant-baseline="central">Alerts store</text>
<text class="ts" x="295" y="312" text-anchor="middle" dominant-baseline="central">TimescaleDB + Redis</text>
</g>

<line x1="295" y1="140" x2="295" y2="270" class="arr" marker-end="url(#arrow)"/>
<line x1="295" y1="240" x2="295" y2="270" class="arr" marker-end="url(#arrow)"/>

<g class="box-red">
<rect x="420" y="60" width="150" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="84" text-anchor="middle" dominant-baseline="central">Response engine</text>
<text class="ts" x="495" y="102" text-anchor="middle" dominant-baseline="central">Subscribes to alerts</text>
</g>

<line x1="380" y1="295" x2="495" y2="120" class="arr" marker-end="url(#arrow)"/>

<g class="box-red">
<rect x="420" y="140" width="150" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="162" text-anchor="middle" dominant-baseline="central">Blocklist (iptables)</text>
</g>

<g class="box-red">
<rect x="420" y="194" width="150" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="216" text-anchor="middle" dominant-baseline="central">Isolate host (AWS SG)</text>
</g>

<g class="box-red">
<rect x="420" y="248" width="150" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="495" y="270" text-anchor="middle" dominant-baseline="central">Logger</text>
</g>

<line x1="495" y1="120" x2="495" y2="140" class="arr" marker-end="url(#arrow)"/>
<line x1="495" y1="120" x2="495" y2="194" class="arr" marker-end="url(#arrow)"/>
<line x1="495" y1="120" x2="495" y2="248" class="arr" marker-end="url(#arrow)"/>

<g class="box-teal">
<rect x="590" y="60" width="80" height="232" rx="8" stroke-width="0.5"/>
<text class="th" x="630" y="98" text-anchor="middle" dominant-baseline="central">React UI</text>
<text class="ts" x="630" y="118" text-anchor="middle" dominant-baseline="central">Dashboard</text>
<text class="ts" x="630" y="136" text-anchor="middle" dominant-baseline="central">Alerts</text>
<text class="ts" x="630" y="154" text-anchor="middle" dominant-baseline="central">Flows</text>
<text class="ts" x="630" y="172" text-anchor="middle" dominant-baseline="central">Topology</text>
<text class="ts" x="630" y="190" text-anchor="middle" dominant-baseline="central">Blocklist</text>
<text class="ts" x="630" y="208" text-anchor="middle" dominant-baseline="central">Playbook runs</text>
<text class="ts" x="630" y="244" text-anchor="middle" dominant-baseline="central">via FastAPI</text>
</g>

<line x1="380" y1="300" x2="590" y2="180" class="arr" marker-end="url(#arrow)"/>

<text class="th" x="40" y="395">Key metrics</text>
<g class="box-gray">
<rect x="40" y="410" width="250" height="100" rx="8" stroke-width="0.5"/>
<text class="ts" x="55" y="432" dominant-baseline="central">ML precision</text>
<text class="th" x="275" y="432" text-anchor="end" dominant-baseline="central">99%+ on live attacks</text>
<text class="ts" x="55" y="454" dominant-baseline="central">Model robustness</text>
<text class="th" x="275" y="454" text-anchor="end" dominant-baseline="central">0/5 wfuzz evaded</text>
<text class="ts" x="55" y="476" dominant-baseline="central">MTTC reduction</text>
<text class="th" x="275" y="476" text-anchor="end" dominant-baseline="central">99.97% vs manual</text>
<text class="ts" x="55" y="498" dominant-baseline="central">Avg response</text>
<text class="th" x="275" y="498" text-anchor="end" dominant-baseline="central">~12ms per playbook</text>
</g>

<text class="th" x="305" y="395">Detection coverage</text>
<g class="box-blue">
<rect x="305" y="410" width="170" height="100" rx="8" stroke-width="0.5"/>
<text class="ts" x="320" y="432" dominant-baseline="central">XGBoost (ML)</text>
<text class="ts" x="320" y="452" dominant-baseline="central">Behavioral anomaly,</text>
<text class="ts" x="320" y="468" dominant-baseline="central">novel patterns,</text>
<text class="ts" x="320" y="484" dominant-baseline="central">low-rate DoS,</text>
<text class="ts" x="320" y="500" dominant-baseline="central">zero-day candidates</text>
</g>

<g class="box-amber">
<rect x="490" y="410" width="180" height="100" rx="8" stroke-width="0.5"/>
<text class="ts" x="505" y="432" dominant-baseline="central">Suricata (signature)</text>
<text class="ts" x="505" y="452" dominant-baseline="central">Known CVEs, malware,</text>
<text class="ts" x="505" y="468" dominant-baseline="central">port scans, bruteforce,</text>
<text class="ts" x="505" y="484" dominant-baseline="central">explicit attack patterns,</text>
<text class="ts" x="505" y="500" dominant-baseline="central">low false positive rate</text>
</g>
</svg>
