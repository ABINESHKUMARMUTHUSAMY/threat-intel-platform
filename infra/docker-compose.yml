name: threat-intel

services:
  response-engine:
    build:
      context: ../services/response-engine
      dockerfile: Dockerfile
    container_name: threat-intel-response-engine
    restart: unless-stopped
    network_mode: host          # ← NEW: needed to manipulate host iptables
    cap_add:                    # ← NEW: needed for iptables/NET_ADMIN
      - NET_ADMIN
      - NET_RAW
    environment:
      REDIS_HOST: localhost     # ← CHANGED: host network, so localhost
      REDIS_PORT: 6379
      STREAM_NAME: alerts:new
      CONSUMER_GROUP: response-engine
      CONSUMER_NAME: engine-1
      POSTGRES_HOST: localhost  # ← CHANGED: host network, so localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-threat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-threat_intel}
      TRIGGER_SEVERITIES: high,critical
      OPERATOR_ALLOWLIST: 195.252.220.178
      LOG_LEVEL: INFO
      DRY_RUN: "false"          # ← NEW: when "true", iptables commands are logged but not run
      BLOCK_TTL_MINUTES: 60     # ← NEW: how long blocks last by default
      AWS_REGION: us-east-1
      QUARANTINE_SG_ID: sg-0f0f8fffc1b5dccb6
      SENSOR_INSTANCE_ID: i-07ee08624801fa1fb
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy 
  suricata-reader:
    build:
      context: ../services/suricata-reader
      dockerfile: Dockerfile
    container_name: threat-intel-suricata-reader
    restart: unless-stopped
    network_mode: host
    environment:
      EVE_PATH: /host-log/suricata/eve.json
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      STREAM_NAME: alerts:new
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-threat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-threat_intel}
      POLL_INTERVAL_S: "1.0"
      LOG_LEVEL: INFO
    volumes:
      - /var/log/suricata:/host-log/suricata:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  detection:
    build:
      context: ../services/detection
      dockerfile: Dockerfile
    container_name: threat-intel-detection
    restart: unless-stopped
    environment:
      MODELS_DIR: /app/models
      POLL_INTERVAL_S: 2
      BATCH_SIZE: 500
      DETECTION_THRESHOLD: 0.5
      DEDUPE_WINDOW_MIN: 5
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-threat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-threat_intel}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      # Mount the model artifacts read-only
      - ../ml/models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - threat-intel-net
  flow-aggregator:
    build:
      context: ../services/flow-aggregator
      dockerfile: Dockerfile
    container_name: threat-intel-flow-aggregator
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STREAM_NAME: packets:raw
      CONSUMER_GROUP: flow-aggregator
      CONSUMER_NAME: agg-1
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-threat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-threat_intel}
      IDLE_TIMEOUT_S: 60
      FLOW_HARD_CAP_S: 120
      FLUSH_INTERVAL_S: 5
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - threat-intel-net
  capture:
    build:
      context: ../services/capture
      dockerfile: Dockerfile
    container_name: threat-intel-capture
    restart: unless-stopped
    # Host networking — required so the container sees host interfaces
    network_mode: host
    # Specific capabilities for packet capture. NOT --privileged.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      CAPTURE_INTERFACE: ens5
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      STREAM_NAME: packets:raw
      STREAM_MAXLEN: 100000
      STATS_INTERVAL: 10
    depends_on:
      redis:
        condition: service_healthy
  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: threat-intel-api
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-threat_intel}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
      VPC_SUBNET: "10.20.7.0/24 10.20.9.0/24 10.20.10.0/24"
      SENSOR_PRIVATE_IP: "10.20.9.39"
      ATTACKER_PRIVATE_IP: "10.20.7.205"
      VICTIM_PRIVATE_IP: "10.20.10.22"
    ports:
      - "8000:8000"
    volumes:
      - ../services/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - threat-intel-net
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: threat-intel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-threat_intel}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-threat} -d ${POSTGRES_DB:-threat_intel}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - threat-intel-net

  redis:
    image: redis:7-alpine
    container_name: threat-intel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - threat-intel-net

volumes:
  postgres_data:
  redis_data:

networks:
  threat-intel-net:
    driver: bridge
