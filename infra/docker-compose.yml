name: threat-intel

services:
  detection:
    build:
      context: ../services/detection
      dockerfile: Dockerfile
    container_name: threat-intel-detection
    restart: unless-stopped
    environment:
      MODELS_DIR: /app/models
      POLL_INTERVAL_S: 2
      BATCH_SIZE: 500
      DETECTION_THRESHOLD: 0.5
      DEDUPE_WINDOW_MIN: 5
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-threat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-threat_intel}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      # Mount the model artifacts read-only
      - ../ml/models:/app/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - threat-intel-net
  flow-aggregator:
    build:
      context: ../services/flow-aggregator
      dockerfile: Dockerfile
    container_name: threat-intel-flow-aggregator
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STREAM_NAME: packets:raw
      CONSUMER_GROUP: flow-aggregator
      CONSUMER_NAME: agg-1
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-threat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-threat_intel}
      IDLE_TIMEOUT_S: 60
      FLOW_HARD_CAP_S: 120
      FLUSH_INTERVAL_S: 5
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - threat-intel-net
  capture:
    build:
      context: ../services/capture
      dockerfile: Dockerfile
    container_name: threat-intel-capture
    restart: unless-stopped
    # Host networking — required so the container sees host interfaces
    network_mode: host
    # Specific capabilities for packet capture. NOT --privileged.
    cap_add:
      - NET_ADMIN
      - NET_RAW
    environment:
      CAPTURE_INTERFACE: ens5
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      STREAM_NAME: packets:raw
      STREAM_MAXLEN: 100000
      STATS_INTERVAL: 10
    depends_on:
      redis:
        condition: service_healthy
  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile
    container_name: threat-intel-api
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-threat_intel}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      JWT_SECRET: ${JWT_SECRET}
    ports:
      - "8000:8000"
    volumes:
      - ../services/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - threat-intel-net
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: threat-intel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-threat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-threat_intel}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-threat} -d ${POSTGRES_DB:-threat_intel}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - threat-intel-net

  redis:
    image: redis:7-alpine
    container_name: threat-intel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - threat-intel-net

volumes:
  postgres_data:
  redis_data:

networks:
  threat-intel-net:
    driver: bridge
